backend = "glx";
vsync = true;

force-win-blend = true;

window-shader-fg-rule = "translucent-dark-colors.glsl:class_g = 'Pcmanfm'";

round-borders = 1;
corner-radius = 20;
rounded-corners = true;

rounded-corners-exclude: [
    "window_type = 'tooltip'",
    "window_type = 'dock'",
    "window_type = 'fullscreen'"
];

blur-method = "dual_kawase";
blur-strength = 0;
blur-background = true;

blur-background-exclude: [
    "class_g != 'Alacritty' && class_g != 'Pcmanfm'"
];

# https://www-gem.codeberg.page/sys_picom/
animations = (
    {
        triggers = [ "close", "hide" ];
        opacity = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.2;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.2;
            start = 1;
            end = 0.5;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "open", "show" ];
        opacity = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.2;
            start = 0;
            end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.2;
            start = 0.25;
            end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "geometry" ];
        scale-x = {
            curve = "cubic-bezier(0,0,0,1)";
            duration = 0.2;
            start = "window-width-before / window-width";
            end = 1;
        };
        scale-x-reverse = {
            curve = "cubic-bezier(0,0,0,1)";
            duration = 0.2;
            start = "window-width / window-width-before";
            end = 1;
        };
        scale-y = {
            curve = "cubic-bezier(0,0,0,1)";
            duration = 0.2;
            start = "window-height-before / window-height";
            end = 1;
        };
        scale-y-reverse = {
            curve = "cubic-bezier(0,0,0,1)";
            duration = 0.2;
            start = "window-height / window-height-before";
            end = 1;
        };
        offset-x = {
            curve = "cubic-bezier(0,0,0,1)";
            duration = 0.2;
            start = "window-x-before - window-x";
            end = 0;
        };
        offset-y = {
            curve = "cubic-bezier(0,0,0,1)";
            duration = 0.2;
            start = "window-y-before - window-y";
            end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    }
)
